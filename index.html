    * { font-family: 'Awke', Arial, sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; }

    #wrap {
      position: relative;
      width: 100%;
      height: 100vh;
    }

    #mynetwork {
      width: 100%;
      height: 100%;
      background-color: #0a0a0a;
    }


    #viz-title {
      color: #fff;
      font-family: 'Awke', Arial, sans-serif;
      font-size: 18px;
      letter-spacing: 0.04em;
      line-height: 1.3;
      pointer-events: none;
    }


    #about-btn {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background: rgba(20,20,20,0.92);
      border: 1px solid #444;
      color: #fff;
      font-family: 'Awke', Arial, sans-serif;
      font-size: 13px;
      padding: 7px 20px;
      cursor: pointer;
      letter-spacing: 0.05em;
    }

    /* ── About popup ── */
    #about-popup {
      display: none;
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 99998;
      background: rgba(20,20,20,0.97);
      border: 1px solid #333;
      color: #ccc;
      font-family: 'Awke', Arial, sans-serif;
      font-size: 13px;
      padding: 20px 24px;
      max-width: 380px;
      line-height: 1.7;
    }

    #about-popup a {
      color: #1ED6FF;
      text-decoration: none;
    }

    #about-popup a:hover {
      text-decoration: underline;
    }

    #about-close {
      display: block;
      margin-top: 12px;
      text-align: right;
      cursor: pointer;
      color: #888;
      font-size: 11px;
      letter-spacing: 0.05em;
    }

    #about-close:hover { color: #fff; }

    #bg-video {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
      filter: brightness(0.25);
    }
    #mynetwork { z-index: 2; }
    #overlay-controls { z-index: 9999; }
    #graph-legend { z-index: 9999; }
    #loadingBar { z-index: 99999; }
   
    #overlay-controls {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #search-box {
      padding: 6px 10px;
      border: 1px solid #444;
      background: rgba(255, 255, 255, 0.92);
      color: #888;
      font-size: 13px;
      width: 220px;
    }
    #search-box::placeholder { color: #888; }

    #search-results {
      background: rgba(20,20,20,0.95);
      border: 1px solid #333;
      color: #ccc;
      font-size: 12px;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }
    .search-result-item {
      padding: 5px 10px;
      cursor: pointer;
    }
    .search-result-item:hover { background: #222; color: #fff; }

    #zoom-row {
      display: flex;
      gap: 6px;
    }
    #zoom-row button {
      padding: 5px 12px;
      background: rgba(20,20,20,0.92);
      border: 1px solid #444;
      color: #fff;
      cursor: pointer;
      font-size: 16px;
    }
    #zoom-row button:hover { background: #333; }


    #config-panel {
      background: rgba(20,20,20,0.92);
      border: 1px solid #333;
      color: #fff;
      font-size: 11px;
      max-width: 220px;
      overflow: hidden;
    }


    #config-panel .vis-configuration-wrapper {
      padding: 6px !important;
    }
    #config-panel .vis-config-label {
      color: #ccc !important;
      font-size: 11px !important;
    }
    #config-panel input[type=range] {
      accent-color: #FF3863;
    }
    #config-panel button {
      background: #222 !important;
      color: #fff !important;
      border: 1px solid #444 !important;
      font-size: 11px !important;
    }

  
    #graph-legend {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 9999;
      background: rgba(20,20,20,0.92);
      color: #fff;
      padding: 12px 16px;
      border: 1px solid #333;
      font-family: Arial, sans-serif;
      font-size: 13px;
      line-height: 1.7;
    }
    .legend-title {
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 13px;
      border-bottom: 1px solid #444;
      padding-bottom: 5px;
    }
    .legend-item { display: flex; align-items: center; gap: 8px; }
    .legend-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }


    #loadingBar {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(17,17,17,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.5s;
    }
    #loadingInner { text-align: center; color: #fff; font-family: Arial, sans-serif; }
    #loadingTrack {
      width: 300px; height: 6px; background: #333;
      border-radius: 3px; margin-top: 10px; overflow: hidden;
    }
    #loadingFill {
      height: 100%; width: 0; background: #FF3863;
      transition: width 0.1s; border-radius: 3px;
    }
  </style>
</head>

var container = document.getElementById('mynetwork');
var data = { nodes: nodes, edges: edges };
var options = {
  nodes: {
    scaling: { label: { enabled: false } }
  },
  physics: {
    enabled: true,
    solver: "forceAtlas2Based",
    forceAtlas2Based: {
      theta: 0.5,
      gravitationalConstant: -120,
      centralGravity: 0.003,
      springLength: 350,
      springConstant: 0.04,
      damping: 0.5,
      avoidOverlap: 0.8
    },
    stabilization: { enabled: true, iterations: 3000, fit: true }
  },
  interaction: { dragNodes: true, hideEdgesOnDrag: false },
  edges: {
    smooth: { enabled: true, type: "dynamic" },
    color: { color: "rgba(255,255,255,0.2)", highlight: "rgba(255,255,255,0.6)" }
  },
  configure: {
    enabled: true,
    filter: function(option, path) { return option === "gravitationalConstant"; },
    container: document.getElementById("config-panel")
  }
};

var network = new vis.Network(container, data, options);
network.once("startStabilizing", function() {
  network.setOptions({ physics: { forceAtlas2Based: { gravitationalConstant: -270 } } });
});

network.on("stabilizationProgress", function(params) {
  var pct = Math.round(params.iterations / params.total * 100);
  document.getElementById('loadingText').textContent = pct + '%';
  document.getElementById('loadingFill').style.width = pct + '%';
});
network.once("stabilizationIterationsDone", function() {
  document.getElementById('loadingText').textContent = '100%';
  document.getElementById('loadingFill').style.width = '100%';
  var bar = document.getElementById('loadingBar');
  bar.style.opacity = 0;
  setTimeout(function() {
    bar.style.display = 'none';
    // Let physics run briefly so user sees it alive, then freeze
    setTimeout(function() {
      network.setOptions({ physics: false });
    }, 3000);
  }, 400);
});

// Zoom
document.getElementById('btn-zoom-in').addEventListener('click', function() {
  network.moveTo({ scale: network.getScale() * 1.3 });
});
document.getElementById('btn-zoom-out').addEventListener('click', function() {
  network.moveTo({ scale: network.getScale() / 1.3 });
});
document.getElementById('btn-fit').addEventListener('click', function() {
  network.fit({ animation: { duration: 400, easingFunction: 'easeInOutQuad' } });
});

// Search
var searchBox = document.getElementById('search-box');
var searchResults = document.getElementById('search-results');

searchBox.addEventListener('input', function() {
  var q = this.value.trim().toLowerCase();
  searchResults.innerHTML = '';
  if (!q) { searchResults.style.display = 'none'; return; }
  var matches = nodes.get().filter(function(n) {
    return n.label && n.label.toLowerCase().includes(q);
  }).slice(0, 10);
  if (!matches.length) { searchResults.style.display = 'none'; return; }
  matches.forEach(function(n) {
    var item = document.createElement('div');
    item.className = 'search-result-item';
    item.textContent = n.label;
    item.addEventListener('click', function() {
      network.focus(n.id, { scale: 1.5, animation: { duration: 500, easingFunction: 'easeInOutQuad' } });
      network.selectNodes([n.id]);
      searchResults.style.display = 'none';
      searchBox.value = n.label;
    });
    searchResults.appendChild(item);
  });
  searchResults.style.display = 'block';
});

document.addEventListener('click', function(e) {
  if (!document.getElementById('overlay-controls').contains(e.target)) {
    searchResults.style.display = 'none';
  }
});

// About popup
document.getElementById('about-btn').addEventListener('click', function() {
  var p = document.getElementById('about-popup');
  p.style.display = p.style.display === 'block' ? 'none' : 'block';
});
document.getElementById('about-close').addEventListener('click', function() {
  document.getElementById('about-popup').style.display = 'none';
});
